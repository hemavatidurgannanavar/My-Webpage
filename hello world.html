<!DOCTYPE html>
<html>
<head>
    <title>My First Webpage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #520e79;
            text-align: center;
        }

        header {
            background-color: #461172;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: #580d3f;
            padding: 10px;
        }

        nav a {
            color: rgb(212, 173, 186);
            text-decoration: none;
            margin: 20px;
        }

        main {
            padding: 50px;
        }

        h1 {
            color: #8daed4;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My First Webpage</h1>
        <p>Welcome to my website</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <h1>Hello World!</h1>

        <p>
            This is my first webpage created using HTML and CSS.
        </p>

        <button>Click Me</button>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
